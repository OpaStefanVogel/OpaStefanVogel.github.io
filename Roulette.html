function Logvar() {
  let id=document.createElement('div');
  id.setAttribute('style','display:block; border:solid; margin:10px; white-space:pre; overflow:auto');
  id.removeAttribute('id');
  let text='';

  if (gewonnen) text=text+'gewonnen'; else text=text+'nicht gewonnen'
  text=text+'\n';
  text=text+'neues Guthaben: '+vorheriges_Guthaben+'-'+verloren+'+'+gewonnen+'='+Guthaben+';\n'+'\n';

  text=text+'Distanz = neue Position - alte Position = '+neuer_Kugelplatz+' - '+alter_Kugelplatz+' = '+(neuer_Kugelplatz-alter_Kugelplatz);

  text=text+', in der anderen Drehrichtung '+alter_Kugelplatz+' - '+neuer_Kugelplatz+' = '+(alter_Kugelplatz-neuer_Kugelplatz);
  if (alter_Kugelplatz<neuer_Kugelplatz) text=text+' = Distanz '+(alter_Kugelplatz-neuer_Kugelplatz+37);
  text=text+',\n';
  text=text+'Distanzen1='+Distanzen1+';\n';
  text=text+'Distanzen2='+Distanzen2+';\n';
  text=text+'Bereiche für Distanzen1:\n'+Verlauf;
  Tabellen.appendChild(id);
  id.innerHTML=text;
  Logfile.innerText=Logfile.innerText+text;
  }

function getroffen(p) {
  Wurfnr=Wurfnr+1;
  neuer_Kugelplatz=p;
  verloren=neuer_Einsatz.length;
  gewonnen=0;
  if (neuer_Einsatz.indexOf(p)>-1) {verloren=verloren-1;gewonnen=35}
  vorheriges_Guthaben=Guthaben;
  Guthaben=Guthaben-verloren+gewonnen;
  let p1=0;
  let p2=0;
  if (Wurfnr%2==1) {p1=p-alter_Kugelplatz; p2=alter_Kugelplatz-p} else {p1=alter_Kugelplatz-p; p2=p-alter_Kugelplatz}
  if (p1<0) p1=p1+37; //p1=p1+1;
  if (p2<0) p2=p2+37; //p2=p2+1;
  Distanzen1.push(p1); Distanzen1.sort(Zsort);
  Distanzen2.push(p2); Distanzen2.sort(Zsort);
  neu_setzen(Distanzen1);
  Logvar();
  alter_Kugelplatz=p;
  }

function neu_setzen(Distanzen1) {
  Verlauf='';
  Bereiche=[];
  for (let i=0;i<Distanzen1.length;i++) {
    Bereich=[Distanzen1[i]];
    for (let j=i+1;j<Distanzen1.length;j++) Bereich.push(Distanzen1[j]);
    for (let j=0;j<i;j++) Bereich.push(Distanzen1[j]+37);
    let Mittelwert=Math.round(berechne_Mittelwert(Bereich));
    //if (Wurfnr%2==0) Mittelwert=Mittelwert+1;
    let Streuung=Math.floor(berechne_Streuung(Bereich,Mittelwert));
    Verlauf=Verlauf+Bereich+' Mittelwert='+Mittelwert+' Streuung='+Streuung+'\n';
    Bereiche.push([Bereich,Mittelwert,Streuung]);
    }
  let imin=0;
  let smin=10000000;
  for (let i=0;i<Bereiche.length;i++) if (Bereiche[i][2]<smin) {imin=i;smin=Bereiche[i][2]}
  Verlauf=Verlauf+'minimale Streuung='+smin+' bei Mittelwert=';
  Einsatz=neuer_Einsatz;
  neuer_Einsatz=[];
  Bereich=Bereiche[imin];
  Verlauf=Verlauf+Bereich[1]+'\n';
  for (let z=Bereich[1]-Bereich[2];z<Bereich[1]+Bereich[2]+1;z++) {
    let n=Math.round(neuer_Kugelplatz+z);
    if (n>36) neuer_Einsatz.push(n-37); else neuer_Einsatz.push(n);
    }
  let np=neuer_Kugelplatz+Bereich[1];
  Verlauf=Verlauf+'neue mittlere Position ist '+neuer_Kugelplatz+'+'+Bereich[1];
  if (np>36) Verlauf=Verlauf+'-37='+(np-37); else Verlauf=Verlauf+'='+np;
 
  Verlauf=Verlauf+', dazu noch auf beiden Seiten '+smin+' Plätze\n';
  Verlauf=Verlauf+'neuer Einsatz auf die Position';
  if (neuer_Einsatz.length>1) Verlauf=Verlauf+'en';
  Verlauf=Verlauf+' ['+neuer_Einsatz+']\n</code>';
 
  }
 
function Zsort(a,b) {if (a<b) return -1;if (a==b) return 0; return 1}
 
function berechne_Mittelwert(arr) {
  let mw=0;
  for (let i=0;i<arr.length;i++) mw=mw+arr[i];
  mw=mw/arr.length;
  return mw;
  }
 
function berechne_Streuung(arr,mw) {
  let st=0;
  for (let i=0;i<arr.length;i++) st=st+(arr[i]-mw)**2;
  st=Math.sqrt(st/arr.length);
  return st;
  }
