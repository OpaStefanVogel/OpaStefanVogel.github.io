function getroffen(p) {
  Wurfnr=Wurfnr+1;
  neuer_Kugelplatz=p;
  let p2=0;
  let p3=0;
  if (Wurfnr%2==1) {p2=p-alter_Kugelplatz; p3=alter_Kugelplatz-p} else {p2=alter_Kugelplatz-p; p3=p-alter_Kugelplatz}
  if (p2<0) p2=p2+37; p2=p2+1;
  if (p3<0) p3=p3+37; p3=p3+1;

  }

function neu_setzen() {
  Verlauf='';

  for (let i=0;i<Bereiche.length;i++) if (Bereiche[i][2]<smin) {imin=i;smin=Bereiche[i][2]}
  Verlauf=Verlauf+'imin='+imin+' smin='+smin+'<br/>\n';

    if (n>37) neuer_Einsatz.push(n-37); else neuer_Einsatz.push(n);
    }

  }

function Zsort(a,b) {if (a<b) return -1;if (a==b) return 0; return 1}

function berechne_Mittelwert(arr) {
  let mw=0;
  for (let i=0;i<arr.length;i++) mw=mw+arr[i];
  mw=mw/arr.length;
  return mw;
  }

function berechne_Streuung(arr,mw) {
  let st=0;
  for (let i=0;i<arr.length;i++) st=st+(arr[i]-mw)**2;
  st=Math.sqrt(st/arr.length);
  return st;
  }
